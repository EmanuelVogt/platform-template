name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # This file ships to every product generated from the template (copier does not
  # exclude it). A product that pushes a commit to main whose subject starts with
  # "chore(release): " gets no CI run at all for that push — an owner-accepted
  # risk (design.md § Risks & Concerns), not a bug. The github.ref clause below is
  # load-bearing: without it, the v* tag pushed by release.yml — whose head commit
  # IS the marker — would also skip, silently retiring AD-033's enforcement on
  # every tag.
  detect:
    name: Detect
    runs-on: ubuntu-latest
    if: >-
      !(github.event_name == 'push'
        && github.ref == 'refs/heads/main'
        && startsWith(github.event.head_commit.message, 'chore(release): '))
    outputs:
      template: ${{ steps.detect.outputs.template }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: detect
        run: |
          if [ -d catalog ]; then
            echo "template=true" >> "$GITHUB_OUTPUT"
          else
            echo "template=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Lint + typecheck + builds
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint typecheck
      - run: pnpm --filter api build:emit
      - run: pnpm turbo build --filter=web
      # TOOL-11: regenera o contrato e falha num diff sujo — este job não tem o
      # `if: needs.detect.outputs.template` de `gates`, então o step chega ao filho.
      #
      # O export monta o grafo Nest inteiro e o boot valida env de forma
      # fail-fast, então sem estes placeholders o step morre antes de escrever a
      # primeira linha de openapi.json. Nenhum deles abre conexão: o passo só lê
      # metadata de decorator. A fonte da verdade é CONTRACT_ENV_DEFAULTS
      # (scripts/platform/lib/child.mjs), que copier.yml não copia para o filho —
      # daí a duplicação aqui, prendida por contract-env.test.mjs.
      - run: pnpm contract:check
        env:
          NODE_ENV: test
          DATABASE_SSL: disable
          TRUST_PROXY_HOPS: "0"
          BREACH_CHECK_ENABLED: "false"
          WEB_ORIGIN: http://localhost:3000
          R2_ACCOUNT_ID: placeholder
          R2_ACCESS_KEY_ID: placeholder
          R2_SECRET_ACCESS_KEY: placeholder
          R2_BUCKET: placeholder
          R2_ENDPOINT: https://placeholder.r2.example.com
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          REDIS_URL: redis://localhost:6379

  test-unit:
    name: Unit (api + web)
    runs-on: ubuntu-latest
    needs: [detect, quality]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  test-coverage:
    name: Coverage gate (api int + e2e, testcontainers)
    runs-on: ubuntu-latest
    needs: [detect, quality]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ubuntu-latest já provê o Docker daemon que o testcontainers usa.
      # test:coverage roda unit+int+e2e num processo Vitest só, funde a cobertura
      # e aplica os thresholds por glob — falha o build se erodir.
      - run: pnpm test:coverage
      # CI-01/AC1: prova de independência de ordem do projeto api-e2e. Corre de novo,
      # sozinho e embaralhado — test:coverage acima já provou cobertura e correção,
      # este step só prova que a suíte não depende da ordem dos testes.
      - run: pnpm test:e2e -- --sequence.shuffle

  gates:
    name: Gates
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.template == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pipx install 'copier==9.17.2'
      - run: pnpm test:scripts
      - run: pnpm catalog:lint
      - run: pnpm catalog:typecheck
      - run: pnpm catalog:eslint
      - name: ADV-04 no catalog fix without advisory (cada commit do PR)
        if: github.event_name == 'pull_request'
        run: >-
          node scripts/platform/advisory-required.mjs --range
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  catalog:
    name: "catalog:check (${{ matrix.entry }} / ${{ matrix.web_stack }})"
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.template == 'true'
    strategy:
      fail-fast: false
      matrix:
        entry: [identity, attachment, audit, notification, tag, professional]
        web_stack: [vite, next]
        exclude:
          # `notification` não declara `web` nem `dependsOn`: as duas pernas
          # instalam e testam o mesmo código. A única diferença — o `runGates` do
          # shell em volta — já é coberta pela matriz `smoke`, sem o custo de
          # render + install + contract de uma perna de catálogo.
          - entry: notification
            web_stack: next
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devuser
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: devdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devuser" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://devuser:devpassword@localhost:5432/devdb
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      R2_ACCOUNT_ID: placeholder
      R2_ACCESS_KEY_ID: placeholder
      R2_SECRET_ACCESS_KEY: placeholder
      R2_BUCKET: placeholder
      R2_ENDPOINT: https://placeholder.r2.example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pipx install 'copier==9.17.2'
      - run: pnpm catalog:check ${{ matrix.entry }} --web-stack ${{ matrix.web_stack }}

  smoke:
    name: "template:smoke (${{ matrix.web_stack }})"
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.template == 'true'
    strategy:
      fail-fast: false
      matrix:
        web_stack: [vite, next]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pipx install 'copier==9.17.2'
      - if: matrix.web_stack == 'next'
        run: pnpm --filter web-next exec vitest run --coverage
      - run: pnpm template:smoke --web-stack ${{ matrix.web_stack }}
