# Gates que só existem no repositório do template. O lefthook mescla este arquivo
# por cima de `lefthook.yml`; `copier.yml` o exclui da cópia, então o produto não
# herda hook apontando para script que ele não recebe (`catalog/` e os validadores
# ficam aqui). Comandos chamam o módulo direto, sem passar por script de
# `package.json`, porque o `package.json` do filho não tem esses scripts.
pre-push:
  piped: true
  commands:
    # priority 3: entre typecheck (2) e test-coverage (4) de lefthook.yml — sem
    # priority explícita o lefthook 2.x ordena os comandos do pre-push
    # alfabeticamente, o que rodava este passo antes de migrations/typecheck.
    catalog-typecheck:
      priority: 3
      run: node scripts/platform/catalog-stage.mjs
    # priority 5: depois de test-coverage (4). `test:coverage` é Vitest sobre
    # `apps/**` e nunca executa `scripts/platform/__tests__/*.test.mjs` — sem esta
    # entrada, a suíte que verifica o contrato do template com o filho só rodava no
    # job Gates da CI, depois do push, num check que não barra nada (a `main` não
    # tem branch protection, e § No pull requests dispensa o fluxo de PR).
    platform-scripts:
      priority: 5
      run: node --test scripts/platform/__tests__/*.test.mjs
    # guarda do freeze de release — bloqueia push a main de quem não segura o
    # lease durante a janela do corte. `use_stdin: true`: sem essa flag o
    # lefthook 2.1.9 NÃO repassa o stdin do protocolo do pre-push do git ao
    # comando (confirmado empiricamente); sem ela o script sempre cairia no
    # fallback por branch local, que é só reserva.
    release-freeze:
      priority: 1
      use_stdin: true
      run: node scripts/platform/release-freeze-guard.mjs

pre-commit:
  commands:
    catalog-lint:
      # o changelog entra porque o seu heading mais recente é a versão do kernel que
      # toda entrada tem de aceitar no kernelRange (issue #9)
      glob: "{catalog/**,docs/advisories/**,docs/dev/template-changelog.md}"
      # PLATFORM_ENTRY_BUMP_STATE=staged: aqui `HEAD` é o *pai* do commit, então
      # a regra de bump (REL-04) tem de ler o índice — senão o conserto que está
      # sendo commitado é invisível e nenhum commit sob `catalog/**` passa
      run: PLATFORM_ENTRY_BUMP_STATE=staged node scripts/platform/catalog-lint.mjs
    format:
      # formata e re-adiciona em vez de barrar o commit: com outras sessões
      # trabalhando neste mesmo checkout, um hook que falha apareceria pra elas como
      # erro sem contexto. {staged_files} limita o `git add` aos arquivos que este
      # próprio hook formatou — nunca varre edição alheia em andamento
      glob: "{*,**/*}.{ts,tsx,mts,mjs,cjs,js,jsx,json,yml,yaml,css}"
      run: pnpm exec prettier --write {staged_files} && git add {staged_files}

commit-msg:
  commands:
    advisory-required:
      run: node scripts/platform/advisory-required.mjs {1}
