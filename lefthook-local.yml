# Gates que só existem no repositório do template. O lefthook mescla este arquivo
# por cima de `lefthook.yml`; `copier.yml` o exclui da cópia, então o produto não
# herda hook apontando para script que ele não recebe (`catalog/` e os validadores
# ficam aqui). Comandos chamam o módulo direto, sem passar por script de
# `package.json`, porque o `package.json` do filho não tem esses scripts.
pre-push:
  piped: true
  commands:
    catalog-typecheck:
      run: node scripts/platform/catalog-stage.mjs

pre-commit:
  commands:
    catalog-lint:
      # o changelog entra porque o seu heading mais recente é a versão do kernel que
      # toda entrada tem de aceitar no kernelRange (issue #9)
      glob: "{catalog/**,docs/advisories/**,docs/dev/template-changelog.md}"
      run: node scripts/platform/catalog-lint.mjs
    format:
      # formata e re-adiciona em vez de barrar o commit: com outras sessões
      # trabalhando neste mesmo checkout, um hook que falha apareceria pra elas como
      # erro sem contexto. {staged_files} limita o `git add` aos arquivos que este
      # próprio hook formatou — nunca varre edição alheia em andamento
      glob: "**/*.{ts,tsx,mts,mjs,cjs,js,jsx,json,yml,yaml,css}"
      run: pnpm exec prettier --write {staged_files} && git add {staged_files}

commit-msg:
  commands:
    advisory-required:
      run: node scripts/platform/advisory-required.mjs {1}
