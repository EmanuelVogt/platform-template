<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">platform-template</title>
  <desc id="banner-desc">Kernel NestJS + front React headless, catálogo de módulos versionado e harness de agentes, distribuído como template copier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a3a"/>
      <stop offset="1" stop-color="#161233"/>
    </linearGradient>
    <radialGradient id="glow-indigo" cx="0.8" cy="0.25" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="0.08" cy="1" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="24"/>
    </clipPath>
  </defs>

  <!-- fundo -->
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow-indigo)"/>
    <rect width="1200" height="300" fill="url(#glow-cyan)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- texto -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
    <text x="64" y="70" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="3" fill="#8b93b8">COPIER TEMPLATE · KERNEL + CATÁLOGO</text>

    <text x="62" y="140" font-size="64" font-weight="800" letter-spacing="-1.5" fill="url(#title)">platform<tspan fill="#818cf8">-</tspan>template</text>

    <text x="64" y="180" font-size="19" fill="#aab2d5">Kernel NestJS + front React headless, catálogo de módulos versionado</text>
    <text x="64" y="206" font-size="19" fill="#aab2d5">e harness de agentes. Um <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" fill="#c7d2fe">copier copy</tspan> e o produto nasce pronto.</text>

    <!-- pílulas da stack -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#dfe3f5" text-anchor="middle">
      <rect x="64" y="232" width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="112" y="251.5">NestJS 11</text>
      <rect x="170" y="232" width="88" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="214" y="251.5">React 19</text>
      <rect x="268" y="232" width="72" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="304" y="251.5">Vite 8</text>
      <rect x="350" y="232" width="80" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="390" y="251.5">Drizzle</text>
      <rect x="440" y="232" width="120" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="500" y="251.5">pnpm · Turbo</text>
      <rect x="570" y="232" width="120" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="630" y="251.5">copier ≥ 9.4</text>
    </g>
  </g>

  <!-- motivo: kernel + entradas do catálogo -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
    <circle cx="990" cy="150" r="78" fill="#6366f1" fill-opacity="0.28" filter="url(#blur)"/>

    <!-- ligações -->
    <g stroke="#8b93b8" stroke-opacity="0.35" stroke-width="1.5">
      <line x1="990" y1="150" x2="990" y2="40"/>
      <line x1="990" y1="150" x2="1094.6" y2="116"/>
      <line x1="990" y1="150" x2="1054.7" y2="239"/>
      <line x1="990" y1="150" x2="925.3" y2="239"/>
      <line x1="990" y1="150" x2="885.4" y2="116"/>
    </g>

    <!-- pulsos viajando das entradas para o kernel -->
    <g fill="#22d3ee">
      <circle r="3"><animateMotion dur="3.2s" repeatCount="indefinite" path="M990,40 L990,150"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle r="3"><animateMotion dur="3.2s" begin="0.65s" repeatCount="indefinite" path="M1094.6,116 L990,150"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="3.2s" begin="0.65s" repeatCount="indefinite"/></circle>
      <circle r="3"><animateMotion dur="3.2s" begin="1.3s" repeatCount="indefinite" path="M1054.7,239 L990,150"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="3.2s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle r="3"><animateMotion dur="3.2s" begin="1.95s" repeatCount="indefinite" path="M925.3,239 L990,150"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="3.2s" begin="1.95s" repeatCount="indefinite"/></circle>
      <circle r="3"><animateMotion dur="3.2s" begin="2.6s" repeatCount="indefinite" path="M885.4,116 L990,150"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="3.2s" begin="2.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- órbita -->
    <circle cx="990" cy="150" r="110" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="3 7"/>

    <!-- entradas do catálogo -->
    <g font-size="12" fill="#c7cdea" text-anchor="middle">
      <rect x="944" y="25" width="92" height="30" rx="15" fill="#0f1530" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="990" y="44.5">identity</text>
      <rect x="1048.6" y="101" width="92" height="30" rx="15" fill="#0f1530" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="1094.6" y="120.5">notification</text>
      <rect x="1008.7" y="224" width="92" height="30" rx="15" fill="#0f1530" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="1054.7" y="243.5">audit</text>
      <rect x="879.3" y="224" width="92" height="30" rx="15" fill="#0f1530" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="925.3" y="243.5">attachment</text>
      <rect x="839.4" y="101" width="92" height="30" rx="15" fill="#0f1530" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="885.4" y="120.5">tag</text>
    </g>

    <!-- kernel -->
    <rect x="940" y="100" width="100" height="100" rx="24" fill="#0f1530" stroke="url(#accent)" stroke-width="2"/>
    <rect x="948" y="108" width="84" height="84" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="990" y="146" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">kernel</text>
    <text x="990" y="166" font-size="10.5" fill="#8b93b8" text-anchor="middle" letter-spacing="1">SHARED</text>
  </g>
</svg>
