_min_copier_version: "9.4.0"
_answers_file: .copier-answers.yml
_subdirectory: "."

_exclude:
  - copier.yml
  - CLAUDE.md
  - TEMPLATE.md
  # cara pública do repositório do template: o produto escreve o próprio README
  # (`README.md.jinja`) e decide a própria licença
  - LICENSE
  - .github/README.md
  - .github/assets
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - node_modules
  - .turbo
  - dist
  - coverage
  - "*.tsbuildinfo"
  - .worktrees
  - .specs
  # âncora obrigatória: `catalog/` casaria qualquer diretório com esse nome em
  # qualquer profundidade e levava junto `docs/catalog/`. Sem a barra final porque
  # o copier testa o caminho de destino como Path, que nunca traz a barra — com ela
  # o diretório-raiz escapa e é criado vazio no filho
  - /catalog
  # auditorias e análises internas do template — mesma âncora do `/catalog`:
  # sem a barra inicial casaria qualquer diretório com esse nome em qualquer
  # profundidade; sem a final o diretório-raiz escapa e nasce vazio no filho
  - /docs/platform_template
  # gate de tag do próprio template — assume `_copier_conf.answers_file` ausente
  # e o `.copier-answers.yml.jinja` da raiz; no filho seria inerte, mas não deve
  # nem chegar lá. O filho não ganha workflow de atualização nenhum: ele nunca se
  # atualiza sozinho — detectar o atraso é automático (hook `template-behind`),
  # aplicar é ato do operador, pela skill `template-update`
  - .github/workflows/release.yml
  # gate de formatação do próprio template — o filho herda um `.prettierrc` que
  # carrega, não uma checagem que roda; ver docs/dev/template-changelog.md `v2.3.0`
  - .github/workflows/format.yml
  - .claude/settings.local.json
  - apps/api/.env
  - apps/web/.env.local
  - .claude/skills
  # ferramental que só existe com `catalog/` presente — como o catálogo não é
  # copiado, nada disso roda no filho. Os hooks correspondentes moram em
  # `lefthook-local.yml`, também fora da cópia.
  - lefthook-local.yml
  - scripts/template-smoke.mjs
  - scripts/platform/catalog-check.mjs
  - scripts/platform/catalog-lint.mjs
  - scripts/platform/catalog-stage.mjs
  - scripts/platform/advisory-required.mjs
  - scripts/platform/lib/child.mjs
  - scripts/platform/lib/lint.mjs
  - scripts/platform/__tests__
  - docs/catalog/README-contract.md

_skip_if_exists:
  - README.md
  - docs/adr/*.md
  - .specs/
  - .platform-modules.lock
  - docs/advisories/APPLIED.md
  # seam do produto (main.ts chama depois de mountDocs) — o produto sobrescreve
  # para plugar extensões de boot; um update não pode pisar na customização
  - apps/api/src/bootstrap.product.ts

_tasks:
  # O manifest é copiado literal: `_exclude` casa pelo caminho de DESTINO, então um
  # `package.json.jinja` renderiza para o mesmo `package.json` do template e não há
  # como excluir um sem matar o outro. Daí a poda aqui — idempotente, roda também no
  # update. A lista espelha os scripts que dependem de `catalog/`
  # (`scripts/platform/__tests__/child-manifest.test.mjs` barra divergência).
  - command: >-
      node -e "const fs=require('fs'),f='package.json',p=JSON.parse(fs.readFileSync(f,'utf8'));p.name='{{ project_slug }}';for(const k of ['catalog:check','catalog:lint','catalog:test','catalog:typecheck','template:smoke','test:scripts'])delete p.scripts[k];fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
    when: "{{ not _copier_conf.pretend }}"
  - command: git init -q
    when: "{{ _copier_operation == 'copy' and not _copier_conf.pretend }}"
  - command: ln -sfn AGENTS.md CLAUDE.md
    when: "{{ not _copier_conf.pretend }}"
  # só na geração — em `copier update`, _apply_update roda run_copy (e portanto
  # _tasks) três vezes: old_copy e new_copy são renders efêmeros pra diff, e o
  # próprio destino real roda ANTES do merge três-vias ser aplicado. Sem esta
  # guarda, install/sync rodavam duas vezes num diretório descartável (minutos +
  # rede) e uma terceira vez contra o manifesto pré-diff — a skill
  # template-update já roda `pnpm install` depois do merge de verdade
  - command: pnpm install
    when: "{{ _copier_operation == 'copy' and not _copier_conf.pretend }}"
  - command: pnpm skills:sync
    when: "{{ _copier_operation == 'copy' and not _copier_conf.pretend }}"

_message_after_copy: |
  Projeto {{ project_name }} gerado a partir do platform-template.

  Suportado: macOS, Linux, WSL2 no Windows. Windows nativo não é suportado
  (symlinks e scripts do harness assumem shell POSIX).

  Próximos passos:
    1. cp apps/api/.env.example apps/api/.env  (preencha segredos)
    2. docker compose up -d                     (Postgres + Redis)
    3. pnpm --filter api db:migrate:run
    4. pnpm dev
  Atualizar a plataforma depois: `copier update` na raiz deste repositório.

# ---------------------------------------------------------------- perguntas

project_name:
  type: str
  help: Nome do produto (aparece em títulos, AGENTS.md, e-mails)
  validator: "{% if not project_name %}obrigatório{% endif %}"

project_slug:
  type: str
  help: Slug kebab-case (nome do pacote raiz, containers, aliases de infra)
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: "{% if not project_slug | regex_search('^[a-z][a-z0-9-]*$') %}use kebab-case{% endif %}"

github_org:
  type: str
  help: Organização/usuário GitHub dono do repositório do produto

github_repo:
  type: str
  help: Nome do repositório do produto no GitHub
  default: "{{ project_slug }}"

root_domain:
  type: str
  help: Domínio raiz (zona DNS), ex. exemplo.com.br
  default: "example.com"

app_domain:
  type: str
  help: Subdomínio base da aplicação (front em <app_domain>, api em api.<app_domain>)
  default: "app.{{ root_domain }}"

product_locale:
  type: str
  help: >-
    Locale das strings voltadas ao usuário final — comentários, erros,
    e-mails, `<html lang>` (BCP 47, ex. pt-BR, en-US)
  default: "pt-BR"
