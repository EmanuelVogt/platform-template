pre-push:
  piped: true        # pipeline: se typecheck OU test falhar, o push é barrado
  commands:
    # Primeiro da fila: é o mais barato e o único que pega migration nascida no
    # passado da base — falha que não aparece em teste, só no boot do ambiente.
    migrations:
      run: pnpm --filter api db:check:journal
    typecheck:
      run: pnpm turbo typecheck
    test-api:
      run: pnpm turbo test --filter=api
    # web roda com coverage: o threshold do vitest.config barra push que erode a cobertura.
    test-web:
      run: pnpm turbo test:cov --filter=web

pre-commit:
  commands:
    catalog-lint:
      glob: "{catalog/**,docs/advisories/**}"
      run: pnpm catalog:lint

commit-msg:
  commands:
    advisory-required:
      run: node scripts/platform/advisory-required.mjs {1}
