server {
  # nginx-unprivileged escuta 8080 (non-root, sem capability de bind <1024)
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compressão dos bundles JS/CSS/SVG
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json
             application/xml image/svg+xml font/woff2;

  # Headers de segurança (defense-in-depth; CSP fica no Traefik/app se precisar)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Healthcheck do container (não polui access log)
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Assets com hash no nome: cache longo imutável
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # favicon.ico vem de apps/web/public/ (publicDir do Vite) — arquivo estático
  # real, nunca o fallback do SPA abaixo.
  location = /favicon.ico {
    expires 7d;
    add_header Cache-Control "public";
  }

  # O mime.types do nginx não cobre .mjs e entrega como application/octet-stream;
  # o navegador recusa executar script/worker que não venha rotulado como JS, e o
  # worker do pdf.js — único .mjs do build — morria antes de iniciar, derrubando o
  # preview de PDF. `types` não serve aqui: a diretiva substitui o mapa herdado
  # inteiro em vez de acrescentar, e css/woff2 perderiam o tipo. Location por regex
  # ganha do prefixo /assets/, então cache e headers de segurança são repetidos —
  # add_header também não herda quando o nível de baixo declara os seus.
  location ~ \.mjs$ {
    default_type text/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Fallback SPA: rotas client-side do TanStack Router caem no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
