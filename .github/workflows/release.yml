name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: read

jobs:
  marker:
    name: Marker
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.event.head_commit.message, 'chore(release):')
      || contains(join(github.event.commits.*.message, '|'), 'chore(release):')
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Decide the release from the pushed commit range
        id: decide
        env:
          MARKER_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/platform/lib/release-marker.mjs --decide

  verify:
    name: Verify
    needs: marker
    if: needs.marker.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/platform/release-preflight.mjs "${{ needs.marker.outputs.version }}"
      # Os quatro steps abaixo são os do job `quality` do ci.yml, literalmente —
      # release-gate-parity.test.mjs compara o texto do comando, então `pnpm check`
      # (o alias de `turbo lint typecheck`) não serviria: o gate do release tem de
      # rodar o mesmo comando, não um equivalente.
      - run: pnpm turbo lint typecheck
      - run: pnpm --filter api build:emit
      - run: pnpm turbo build --filter=web
      # Mesmos placeholders do ci.yml e pela mesma razão: o export monta o grafo
      # Nest inteiro e o boot valida env fail-fast. Nenhum abre conexão.
      - run: pnpm contract:check
        env:
          NODE_ENV: test
          DATABASE_SSL: disable
          TRUST_PROXY_HOPS: "0"
          BREACH_CHECK_ENABLED: "false"
          WEB_ORIGIN: http://localhost:3000
          R2_ACCOUNT_ID: placeholder
          R2_ACCESS_KEY_ID: placeholder
          R2_SECRET_ACCESS_KEY: placeholder
          R2_BUCKET: placeholder
          R2_ENDPOINT: https://placeholder.r2.example.com
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          REDIS_URL: redis://localhost:6379
      - run: pnpm test
      - run: pipx install 'copier==9.17.2'
      - run: pnpm test:scripts
      - run: pnpm catalog:lint
      - run: pnpm catalog:typecheck

  catalog:
    name: "catalog:check (${{ matrix.entry }} / ${{ matrix.web_stack }})"
    needs: [marker, verify]
    if: needs.marker.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: [identity, attachment, audit, notification, tag]
        web_stack: [vite, next]
        exclude:
          # `notification` não declara `web` nem `dependsOn`: as duas pernas
          # instalam e testam o mesmo código. A única diferença — o `runGates` do
          # shell em volta — já é coberta pela matriz `smoke`, sem o custo de
          # render + install + contract de uma perna de catálogo.
          - entry: notification
            web_stack: next
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devuser
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: devdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devuser" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://devuser:devpassword@localhost:5432/devdb
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      R2_ACCOUNT_ID: placeholder
      R2_ACCESS_KEY_ID: placeholder
      R2_SECRET_ACCESS_KEY: placeholder
      R2_BUCKET: placeholder
      R2_ENDPOINT: https://placeholder.r2.example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pipx install 'copier==9.17.2'
      - run: pnpm catalog:check ${{ matrix.entry }} --web-stack ${{ matrix.web_stack }}

  smoke:
    name: "template:smoke (${{ matrix.web_stack }})"
    needs: [marker, verify]
    if: needs.marker.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        web_stack: [vite, next]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pipx install 'copier==9.17.2'
      - if: matrix.web_stack == 'next'
        run: pnpm --filter web-next exec vitest run --coverage
      - run: pnpm template:smoke --web-stack ${{ matrix.web_stack }}

  coverage:
    name: "Coverage gate (api int + e2e, testcontainers)"
    needs: [marker, verify]
    if: needs.marker.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Espelha o job `test-coverage` do ci.yml: ubuntu-latest já provê o Docker
      # daemon do testcontainers, e test:coverage funde unit+int+e2e num processo
      # Vitest só e aplica os thresholds por glob.
      - run: pnpm test:coverage
      # release-gate-parity.test.mjs: espelha o step de shuffle do api-e2e que
      # ci.yml roda no job test-coverage (CI-01/AC1) — sem ele o release taguearia
      # sem provar a mesma independência de ordem que o CI exige a cada push.
      - run: pnpm test:e2e -- --sequence.shuffle

  tag:
    name: Tag and push
    needs: [marker, verify, catalog, smoke, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create and push the annotated tag
        env:
          VERSION: ${{ needs.marker.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MESSAGE="$(node scripts/platform/release-preflight.mjs --message "$VERSION")"
          git tag -a "v$VERSION" -m "$MESSAGE"
          git push origin "v$VERSION"

      # --verify-tag: sem ele `gh release create` cria a tag que faltar, o que
      # abriria um segundo caminho de tagueamento ao lado do step acima
      # (AD-034: a tag é ato único do job `tag`).
      - name: Publish the GitHub Release
        env:
          VERSION: ${{ needs.marker.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/platform/release-preflight.mjs --notes "$VERSION" \
            > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
